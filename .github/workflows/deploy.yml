name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          cd /home/user05/dashboard
          git pull origin main
          HOST=${{ secrets.SSH_HOST }} docker compose up -d --build
