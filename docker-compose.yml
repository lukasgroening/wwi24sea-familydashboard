services:
  db:
    image: postgres:16-alpine
    container_name: family_db
    restart: always
    environment:
      - POSTGRES_USER=famly_user
      - POSTGRES_PASSWORD=famly_pass
      - POSTGRES_DB=family_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U famly_user -d family_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: family_backend
    ports:
      - "8400:8000"
    env_file:
      - ./backend/.env
    environment:
      - CORS_ORIGINS=http://${HOST:-localhost}:8401
      - DATABASE_URL=postgresql://famly_user:famly_pass@db:5432/family_dashboard
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      target: final
      args:
        - VITE_API_URL=http://${HOST:-localhost}:8400
    container_name: family_frontend
    ports:
      - "8401:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_data:
