services:
  backend:
    build: 
      context: ./backend
    container_name: family_backend
    ports:
      - "8400:8000"
    env_file:
      - ./backend/.env
    environment:
      - CORS_ORIGINS=http://localhost:8401
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      target: final
      args:
        - VITE_API_URL=http://localhost:8400
    container_name: family_frontend
    ports:
      - "8401:80"
    depends_on:
      - backend